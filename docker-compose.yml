# vLLM runs separately on AMD Developer Cloud and is reached through VLLM_BASE_URL.
# Teammate services (mocks, app, detector) join here; see docs/contracts.md.
#
#   docker compose up --build                       mock factory + MCP server + agent
#   docker compose run --build --rm detector --scenario out_of_stock   replay M-01 and send the alert to the agent
#   docker compose --profile public up -d           + HTTPS on PUBLIC_HOST (for Evolus)
#
# Service ports are bound to localhost; on a public server only Caddy (80/443) is reachable.
services:
  mcp:
    build: .
    command: python -m mcp_server.server
    env_file:
      - path: .env
        required: false
    environment:
      MOCKS_URL: ${MOCKS_URL_DOCKER:-http://mocks:8000}
    ports:
      - "127.0.0.1:8001:8001"

  agent:
    build: .
    command: uvicorn agent.api:app --host 0.0.0.0 --port 8002
    env_file:
      - path: .env
        required: false
    environment:
      MOCKS_URL: ${MOCKS_URL_DOCKER:-http://mocks:8000}
      MANUAL_DIR: /app/manual
    ports:
      - "127.0.0.1:8002:8002"

  mocks:
    build: .
    command: uvicorn mocks.server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

  # One-shot: docker compose run --build --rm detector [--scenario in_stock] [--dry-run]
  detector:
    profiles: ["replay"]
    build: .
    entrypoint: ["python", "-m", "detector.replay"]
    env_file:
      - path: .env
        required: false
    environment:
      ALERT_URL: http://agent:8002/incidents
      MOCKS_URL: http://mocks:8000
    volumes:
      - ./data:/app/data   # ai4i2020.csv is downloaded here on first run
    depends_on:
      - agent
      - mocks

  caddy:
    profiles: ["public"]
    image: caddy:2.8.4
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      VLLM_PORT: ${VLLM_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach vLLM running on the host
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp

volumes:
  caddy_data:
