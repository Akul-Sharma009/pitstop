# vLLM runs separately on AMD Developer Cloud and is reached through VLLM_BASE_URL.
# Teammate services (mocks, app, detector) join here; see docs/contracts.md.
#
#   docker compose up --build                       mock factory + MCP server + agent + screens (localhost:8003)
#   docker compose run --build --rm detector --scenario out_of_stock   replay M-01 and send the alert to the agent
#   docker compose --profile public up -d           + HTTPS on PUBLIC_HOST (for Evolus)
#   docker compose --profile tunnel up -d           + localhost:8088 for a Cloudflare tunnel (Ollama stand-in)
#
# Service ports are bound to localhost; on a public server only Caddy (80/443) is reachable.
services:
  mcp:
    build: .
    command: python -m mcp_server.server
    env_file:
      - path: .env
        required: false
    environment:
      MOCKS_URL: ${MOCKS_URL_DOCKER:-http://mocks:8000}
    ports:
      - "127.0.0.1:8001:8001"

  agent:
    build: .
    command: uvicorn agent.api:app --host 0.0.0.0 --port 8002
    env_file:
      - path: .env
        required: false
    environment:
      MOCKS_URL: ${MOCKS_URL_DOCKER:-http://mocks:8000}
      MANUAL_DIR: /app/manual
    ports:
      - "127.0.0.1:8002:8002"

  # Manager approval + operator summary (app/static), with the approve/reject route to the mocks.
  app:
    build: .
    command: uvicorn app.server:app --host 0.0.0.0 --port 8003
    env_file:   # SCREENS_PASSWORD / SCREENS_USER: a login on the screens (set it when they are public)
      - path: .env
        required: false
    environment:
      AGENT_URL: http://agent:8002
      MOCKS_URL: ${MOCKS_URL_DOCKER:-http://mocks:8000}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - agent
      - mocks

  mocks:
    build: .
    command: uvicorn mocks.server:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

  # One-shot: docker compose run --build --rm detector [--scenario in_stock] [--dry-run]
  detector:
    profiles: ["replay"]
    build: .
    entrypoint: ["python", "-m", "detector.replay"]
    env_file:
      - path: .env
        required: false
    environment:
      ALERT_URL: http://agent:8002/incidents
      MOCKS_URL: http://mocks:8000
    volumes:
      - ./data:/app/data   # ai4i2020.csv is downloaded here on first run
    depends_on:
      - agent
      - mocks

  caddy:
    profiles: ["public"]
    image: caddy:2.8.4
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # The model: vLLM on this machine, or MODEL_UPSTREAM=<gpu-ip>:8080 when the GPU instance is elsewhere.
      MODEL_UPSTREAM: ${MODEL_UPSTREAM:-host.docker.internal:${VLLM_PORT:-8080}}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach vLLM running on the host
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp
      - app

  # Development entry point for a Cloudflare quick tunnel: /v1 (Ollama, needs VLLM_API_KEY) and /mcp.
  tunnel:
    profiles: ["tunnel"]
    image: caddy:2.8.4
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:-}   # required: Caddy refuses /v1 without it
      MODEL_UPSTREAM: ${MODEL_UPSTREAM:-host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - mcp

volumes:
  caddy_data:
